<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" fill="none">
<title>Haiku VM Guest Tools — Laptop</title><desc>Editable isometric guest tools icon: a thin silver aluminum laptop with a dark bezel and keyboard, blue guest screen, bidirectional integration arrows, and a golden settings gear. Transparent background.</desc>
<defs>
<linearGradient id="red" x1="200" y1="240" x2="870" y2="850" gradientUnits="userSpaceOnUse"><stop stop-color="#f4f4f1"/><stop offset=".4" stop-color="#c8cacc"/><stop offset="1" stop-color="#858b90"/></linearGradient>
